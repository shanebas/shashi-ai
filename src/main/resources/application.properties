spring.application.name=shashi-ai

# Ollama Configuration (Spring AI)
spring.ai.ollama.base-url=http://localhost:11435
spring.ai.ollama.chat.model=gemma3

# OpenAI Configuration (Spring AI)
spring.ai.openai.api-key=${OPENAI_API_KEY}

# Chat Client Configuration
shashiai.chat.default-system-prompt=You are an internal HR assistant. Your role is to help employees with questions related to HR policies, such as leave policies, working hours, benefits, and code of conduct.If a user asks for help with anything outside of these topics, kindly inform them that you can only assist with queries related to HR policies.

# Logging Configuration
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx
